<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hanzi-ink · demo</title>
  <link rel="stylesheet" href="../hanzi-ink.css">
  <style>
    :root{color-scheme:light dark;--bg:#f5f5ef;--surface:#fffefa;--ink:#222c27;--muted:#68716b;--line:#dddfd5;--accent:#365e48;--script-ink:#4f7a5e}
    @media(prefers-color-scheme:dark){:root{--bg:#161d19;--surface:#202a23;--ink:#e9eee6;--muted:#a6b2a7;--line:#37453a;--accent:#b4cf9b;--script-ink:#b3d1a2}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
    .shell{max-width:880px;margin:0 auto;padding:0 28px}
    header{padding:56px 0 8px}
    .kicker{font-size:10px;letter-spacing:2px;color:var(--muted);margin:0 0 14px}
    h1{font:600 34px/1.3 Georgia,"Songti SC",serif;margin:0 0 10px}
    p.lead{color:var(--muted);max-width:600px}
    .stage{display:flex;align-items:center;justify-content:center;min-height:240px;margin:30px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;overflow:hidden}
    #ink-stage{margin:0;color:var(--muted);font-size:12px}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button,input,select{font:inherit}
    button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
    button:hover{border-color:var(--accent)}
    button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
    #text-input{flex:1;min-width:180px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
    #pace{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
    #notice{margin:16px 0 0;font-size:12px;color:var(--muted);min-height:1.7em}
    footer{padding:26px 0 60px;margin-top:30px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    code{font-family:Consolas,monospace;font-size:.92em}
  </style>
</head>
<body>
  <header class="shell">
    <p class="kicker">STROKE ORDER RENDERING</p>
    <h1>汉字笔顺，逐笔手写</h1>
    <p class="lead">用真实笔顺数据的中线做等粗细描边，一笔一笔写出来。零依赖，两种节奏：greeting 适合开场白，calm 适合签名与正文。</p>
  </header>

  <main class="shell">
    <div class="stage"><p id="ink-stage">你好</p></div>
    <div class="controls">
      <button type="button" data-text="你好">你好</button>
      <button type="button" data-text="再见">再见</button>
      <button type="button" data-text="我是">我是</button>
      <button type="button" data-text="世界">世界</button>
      <button type="button" data-text="中文">中文</button>
      <input id="text-input" maxlength="8" placeholder="最多 8 个字，回车重写" aria-label="要手写的文字">
      <button class="primary" type="button" id="write-button">写</button>
      <select id="pace" aria-label="书写节奏">
        <option value="normal">normal（默认）</option>
        <option value="greeting" selected>greeting（开场白）</option>
        <option value="calm">calm（签名）</option>
      </select>
      <button type="button" id="replay-button">重写一遍</button>
    </div>
    <p id="notice"></p>
  </main>

  <footer class="shell">hanzi-ink demo · 代码 MIT，笔顺数据 Arphic Public License（Make Me A Hanzi）</footer>

  <script src="../hanzi-data.js"></script>
  <script src="../hanzi-ink.js"></script>
  <script>
    const stage = document.getElementById("ink-stage");
    const notice = document.getElementById("notice");
    const input = document.getElementById("text-input");
    const pace = document.getElementById("pace");
    let last = "你好";

    async function render(text, speed) {
      const clean = [...String(text).trim()].slice(0, 8).join("");
      if (!clean) return;
      last = clean;
      input.value = clean;
      stage.textContent = clean;
      // 每个字约 124 单位 + 28 间隔，换算成展示宽度；最多铺满容器。
      stage.style.setProperty("--handwriting-width", `min(100%, ${clean.length * 124 + (clean.length - 1) * 28}px)`);
      const ok = await HanziInk.paint(stage, "demo", { animate: true, pace: speed });
      if (!ok) { notice.textContent = "没有可渲染的文字。"; return; }
      const missing = stage.querySelectorAll(".handwriting-fallback").length;
      notice.textContent = missing
        ? `有 ${missing} 个字没有本地笔顺数据，已用字体兜底。运行 node tools/fetch-data.mjs ${clean} 可以补齐。`
        : "";
    }

    document.querySelectorAll("[data-text]").forEach((button) => {
      button.addEventListener("click", () => render(button.dataset.text, pace.value));
    });
    document.getElementById("write-button").addEventListener("click", () => render(input.value, pace.value));
    document.getElementById("replay-button").addEventListener("click", () => render(last, pace.value));
    input.addEventListener("keydown", (event) => { if (event.key === "Enter") render(input.value, pace.value); });
    pace.addEventListener("change", () => render(last, pace.value));
    render(last, pace.value);
  </script>
</body>
</html>
